<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/dieta/app/">
    <title>Nutrition Tracker Pro - Redireccionando...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 100%);
            font-family: 'Inter', sans-serif;
        }
        .container {
            text-align: center;
            color: #e2e8f0;
        }
        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        p {
            margin: 10px 0 0 0;
            color: #94a3b8;
            font-size: 14px;
        }
        a {
            color: #667eea;
            text-decoration: none;
            margin-top: 20px;
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #667eea;
            border-radius: 6px;
            transition: all 0.3s;
        }
        a:hover {
            background: rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>📊 Nutrition Tracker Pro</h1>
        <p>Redireccionando...</p>
        <p>Si no se redirige automáticamente,</p>
        <a href="/dieta/app/">haz clic aquí</a>
    </div>

    <script>
        // Redirección alternativa con JavaScript (por si falla meta refresh)
        setTimeout(() => {
            window.location.href = '/dieta/app/';
        }, 100);
    </script>
</body>
</html>
